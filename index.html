<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/logo1.jpg" type="image/x-icon" />
    <!-- <link rel="stylesheet" href="style/styles.css" /> -->
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>TODO App</title>
    <style>
      body {
        height: 100vh;
        background-color: rgb(202, 218, 233);
      }
      .container-fluid {
        width: 100%;
        height: 100vh;
      }
      .main-div {
        min-height: 35%;
        margin: 30px auto;
        border: 1px solid black;
        border-radius: 10px;
        box-shadow: 1px 2px 2px black;
        background: linear-gradient(45deg, #181a1a, #2d1e48);
      }
      .main-div .inputs {
        width: 100%;
      }
      /* .main-div .inputs input {
        width: 20%;
      } */
      .main-div .inputs button {
        width: 20%;
        height: 60px;
      }
      .main-div .inputs .ins {
        width: 80%;
      }
      .main-div .inputs .ins1 {
        width: 40%;
        cursor: pointer;
      }
      .main-div .display-field {
        width: 100%;
        height: 200px;
        background-color: whitesmoke;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .main-div .none {
        width: 100%;
        color: white;
        display: grid;
        row-gap: 10px;
        grid-template-columns: 420px 216px 100px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="main-div p-5 w-50 mt-5">
        <p class="display-4 text-center p-3 text-info">To-do App</p>

        <!-- Inputs  -->

        <div class="inputs d-flex gap-3 flex-row">
          <input
            type="text"
            name=""
            id="js-name-input"
            class="ins form-control mb-3 p-3"
            placeholder="Enter your task !"
          />
          <input type="date" id="js-date-input" class="ins1  form-control mb-3 p-3">
          <button class="btn btn-primary p-1 js-add-todo">
            Add
          </button>
        </div>
        <div class="none text-light"></div>
        
      </div>
    </div>
    <script src="own-js/script.js"></script>
  </body>
</html>
